name: Bug 报告
description: 报告一个可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先搜索已有 Issue，并**删除日志里的敏感信息**（数据库密码、`SESSION_SECRET`、S3 密钥、`GITHUB_TOKEN` 等）。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？影响范围有多大？
      placeholder: 简要说明问题，以及它是否稳定复现。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从干净启动开始，按顺序列出最少的操作。
      placeholder: |
        1. 使用 SQLite 启动
        2. 打开 /setup 完成初始化
        3. ……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 你认为正确的行为是什么？
    validations:
      required: true

  - type: dropdown
    id: database
    attributes:
      label: 数据库
      options:
        - SQLite
        - PostgreSQL
        - MySQL
        - 其他 / 不确定
    validations:
      required: true

  - type: dropdown
    id: storage
    attributes:
      label: 文件存储
      options:
        - 本地磁盘（默认 public/assets/uploads）
        - S3 / R2 / MinIO 等兼容存储
        - 其他 / 不确定
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: 运行方式
      options:
        - bun run dev
        - bun run start（生产构建）
        - 其他
    validations:
      required: true

  - type: input
    id: bun-version
    attributes:
      label: Bun 版本
      description: 输出 `bun --version`。
      placeholder: 1.4.2
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 服务端报错、浏览器控制台或截图。请先脱敏。
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，确认这不是重复问题
          required: true
        - label: 我已移除日志与配置中的密钥、密码和令牌
          required: true
        - label: 我使用的是最新代码，或在描述中注明了版本
          required: false
