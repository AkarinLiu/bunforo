name: 功能请求
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issue。这个项目刻意保持小而完整，说明“为什么需要”比“怎么实现”更有帮助。

  - type: textarea
    id: problem
    attributes:
      label: 需求背景
      description: 现在遇到了什么限制？谁在什么场景下需要它？
      placeholder: 描述问题本身，而不只是某个实现方案。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 你希望它如何工作？可以给出界面、API 或配置上的设想。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过哪些绕过方式？为什么不够好？
    validations:
      required: false

  - type: checkboxes
    id: areas
    attributes:
      label: 影响范围
      description: 可多选，方便评估改动面。
      options:
        - label: 前端 / 交互
        - label: 后端 API / 权限
        - label: 数据库 / 三种方言
        - label: 上传 / 对象存储
        - label: GitHub Discussions 导入
        - label: 文档 / 部署
        - label: 不确定

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，确认这不是重复建议
          required: true
